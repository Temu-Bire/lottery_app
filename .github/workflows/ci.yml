name: CI Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  build-and-test:
    name: Build, Lint, Typecheck & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lottery_user
          POSTGRES_PASSWORD: lottery_password
          POSTGRES_DB: lottery_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run prisma:generate

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript Typecheck
        run: npm run typecheck

      - name: Run Automated Tests
        run: npm test
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://lottery_user:lottery_password@localhost:5432/lottery_db?schema=public
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          JWT_ACCESS_SECRET: github-actions-test-access-secret-32-chars-long
          JWT_REFRESH_SECRET: github-actions-test-refresh-secret-32-chars-long
          TELEGRAM_BOT_TOKEN: github-actions-test-bot-token

      - name: Build TypeScript Production Bundle
        run: npm run build

      - name: Build Production Docker Image
        run: docker build -t lottery-backend:latest .
