version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lottery_backend
    restart: unless-stopped
    ports:
      - "${PORT:-5000}:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      API_PREFIX: /api/v1
      DATABASE_URL: postgresql://${POSTGRES_USER:-lottery_user}:${POSTGRES_PASSWORD:-lottery_password}@postgres:5432/${POSTGRES_DB:-lottery_db}?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-change_in_production_jwt_access_secret_key_123}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change_in_production_jwt_refresh_secret_key_123}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - lottery_network

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lottery_worker
    restart: unless-stopped
    command: ["node", "dist/jobs/worker.js"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-lottery_user}:${POSTGRES_PASSWORD:-lottery_password}@postgres:5432/${POSTGRES_DB:-lottery_db}?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - lottery_network

  postgres:
    image: postgres:16-alpine
    container_name: lottery_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lottery_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lottery_password}
      POSTGRES_DB: ${POSTGRES_DB:-lottery_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lottery_user} -d ${POSTGRES_DB:-lottery_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lottery_network

  redis:
    image: redis:7-alpine
    container_name: lottery_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lottery_network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  lottery_network:
    driver: bridge
