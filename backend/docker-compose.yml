version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: lottery_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lottery_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lottery_password}
      POSTGRES_DB: ${POSTGRES_DB:-lottery_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lottery_user} -d ${POSTGRES_DB:-lottery_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lottery_network

  redis:
    image: redis:7-alpine
    container_name: lottery_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lottery_network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  lottery_network:
    driver: bridge
